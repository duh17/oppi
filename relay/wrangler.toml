# Cloudflare Worker for the Oppi push relay. No account ID and no secrets live here.
# Secrets: APNS_KEY_P8 (the .p8 file's contents), APNS_KEY_ID, APNS_TEAM_ID (see README.md).
# APNS_KEY_P8 also keys registration challenges (HKDF, its own label); no other secret.
name = "oppi-push-relay"
main = "src/cloudflare/worker.ts"
compatibility_date = "2026-10-01"

# Custom domain; deploy creates its DNS record and certificate. One relay per app: each has its
# own APNs topic and App Attest app ID, so each gets its own hostname.
routes = [{ pattern = "push.oppi.chaosdonkey.dev", custom_domain = true }]
# Served only at that hostname, not also at a *.workers.dev address.
workers_dev = false

# The relay keeps no request logs: Workers Logs and invocation logs (method and URL) stay off.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[[durable_objects.bindings]]
name = "REGISTRATIONS"
class_name = "RegistrationObject"

[[durable_objects.bindings]]
name = "APNS_TOKENS"
class_name = "ApnsTokenObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RegistrationObject", "ChallengeObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ApnsTokenObject"]

# Challenges became stateless (src/core/challenge.ts); this deletes every ChallengeObject
# and its storage.
[[migrations]]
tag = "v3"
deleted_classes = ["ChallengeObject"]

[vars]
APP_ID = "AZAQMY4SPZ.dev.chenda.Oppi"
BUNDLE_ID = "dev.chenda.Oppi"
