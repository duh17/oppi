apiVersion: 1

# Removing a rule from `groups` leaves the provisioned copy in Grafana; list it here.
deleteRules:
  - orgId: 1
    uid: oppi-jank-avg
  - orgId: 1
    uid: oppi-timeline-apply-p95
  - orgId: 1
    uid: oppi-markdown-streaming-p95

groups:
  # -- P0: Perf regression detection (24h rolling window) -----------------
  - orgId: 1
    name: oppi-perf-regression
    folder: Oppi Alerts
    interval: 5m
    rules:
      # 1. Slow timeline applies per foreground minute > 2 on any device
      - uid: oppi-slow-timeline-applies
        title: "P0: Slow timeline applies per foreground minute"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: p0
          component: timeline
        annotations:
          summary: "A device had more than 2 timeline applies over 8.3 ms per foreground minute (24h window)"
          description: >-
            The rendering SLO: app.timeline_apply over 8.3 ms (a missed 120 Hz frame)
            per foreground minute, worst device over the last 24 hours. Foreground
            minutes count app.device_resources samples (one every 10 s while active).
            Investigate recent commits touching the chat timeline apply path or the
            delta coalescer.
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: oppi-telemetry-sqlite
            model:
              refId: A
              queryType: table
              rawQueryText: >-
                WITH foreground AS (
                  SELECT device, COUNT(*) * 10 / 60.0 AS minutes FROM events
                  WHERE name = 'app.device_resources' AND ts_ms BETWEEN $__from AND $__to
                  GROUP BY device
                ), slow AS (
                  SELECT device, COUNT(*) AS n FROM events
                  WHERE name = 'app.timeline_apply'
                    AND json_extract(fields_json, '$.duration_ms') > 8.3
                    AND ts_ms BETWEEN $__from AND $__to
                  GROUP BY device
                )
                SELECT COALESCE(MAX(COALESCE(slow.n, 0) / foreground.minutes), 0) AS value
                FROM foreground LEFT JOIN slow ON slow.device = foreground.device
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 2
                  operator:
                    type: and

      # 2. Slow streaming markdown cycles per foreground minute > 0.5 on any device
      - uid: oppi-slow-markdown-streaming
        title: "P0: Slow streaming markdown per foreground minute"
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: p0
          component: markdown
        annotations:
          summary: "A device had more than 0.5 markdown cycles over 8.3 ms per foreground minute (24h window)"
          description: >-
            The rendering SLO: app.markdown_streaming cycles over 8.3 ms (a missed
            120 Hz frame) per foreground minute, worst device over the last 24 hours.
            Check incremental markdown parser changes.
        data:
          - refId: A
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: oppi-telemetry-sqlite
            model:
              refId: A
              queryType: table
              rawQueryText: >-
                WITH foreground AS (
                  SELECT device, COUNT(*) * 10 / 60.0 AS minutes FROM events
                  WHERE name = 'app.device_resources' AND ts_ms BETWEEN $__from AND $__to
                  GROUP BY device
                ), slow AS (
                  SELECT device, COUNT(*) AS n FROM events
                  WHERE name = 'app.markdown_streaming'
                    AND json_extract(fields_json, '$.duration_ms') > 8.3
                    AND ts_ms BETWEEN $__from AND $__to
                  GROUP BY device
                )
                SELECT COALESCE(MAX(COALESCE(slow.n, 0) / foreground.minutes), 0) AS value
                FROM foreground LEFT JOIN slow ON slow.device = foreground.device
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
                  operator:
                    type: and

  # -- P1: Operational health (1h rolling window) -------------------------
  - orgId: 1
    name: oppi-operational-health
    folder: Oppi Alerts
    interval: 1m
    rules:
      # 3. Server turn errors > 3/h
      - uid: oppi-turn-errors
        title: "P1: Server turn error burst"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: p1
          component: server
        annotations:
          summary: "More than 3 turn errors in the last hour"
          description: >-
            The server recorded more than 3 server.turn events with status=error in the
            last hour.
            This means agent sessions are failing. Check server logs for the
            error details — common causes: provider API errors, container OOM,
            session timeout.
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: oppi-telemetry-sqlite
            model:
              refId: A
              queryType: table
              rawQueryText: >-
                SELECT COUNT(*) AS value
                FROM events
                WHERE name = 'server.turn'
                  AND json_extract(tags_json, '$.status') = 'error'
                  AND ts_ms BETWEEN $__from AND $__to
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 3
                  operator:
                    type: and

      # 4. WS ping timeouts > 5/h
      - uid: oppi-ws-ping-timeouts
        title: "P1: WebSocket ping timeout burst"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: p1
          component: websocket
        annotations:
          summary: "More than 5 WS ping timeouts in the last hour"
          description: >-
            The server recorded more than 5 server.ws_ping_timeout events in the
            last hour. This indicates connection reliability issues — clients
            are experiencing disconnects. Check network conditions and server
            resource utilization (CPU/memory on the Server Health dashboard).
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: oppi-telemetry-sqlite
            model:
              refId: A
              queryType: table
              rawQueryText: >-
                SELECT COUNT(*) AS value
                FROM events
                WHERE name = 'server.ws_ping_timeout'
                  AND ts_ms BETWEEN $__from AND $__to
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
                  operator:
                    type: and

  # -- P2: Cost anomaly (24h vs 7d baseline) ------------------------------
  - orgId: 1
    name: oppi-cost-anomaly
    folder: Oppi Alerts
    interval: 15m
    rules:
      # 5. Token cost > 3x 7-day daily average
      - uid: oppi-cost-spike
        title: "P2: Token cost spike (3x baseline)"
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: p2
          component: cost
        annotations:
          summary: "Daily token cost exceeded 3x the 7-day average"
          description: >-
            The total server.turn_usage cost_usd_micros over the last 24 hours is more than
            3x the 7-day daily average. This could indicate runaway sessions,
            a model configuration change, or an unusually heavy workload.
            Check the Server Health dashboard for token usage breakdown.
        data:
          # Query returns ratio of current 24h cost to 7d daily average.
          # relativeTimeRange covers 8 days so $__from = 8d ago, $__to = now.
          # Baseline = 7 days before the current 24h window.
          # Returns 0 if no baseline exists (avoids false positive on first use).
          - refId: A
            relativeTimeRange:
              from: 691200
              to: 0
            datasourceUid: oppi-telemetry-sqlite
            model:
              refId: A
              queryType: table
              rawQueryText: >-
                SELECT CASE
                  WHEN baseline > 0
                    THEN ROUND(current_cost / baseline, 2)
                  ELSE 0.0
                END AS value
                FROM (
                  SELECT
                    COALESCE(
                      (SELECT SUM(json_extract(fields_json, '$.cost_usd_micros')) FROM events
                       WHERE name = 'server.turn_usage'
                         AND ts_ms >= ($__to - 86400000)
                         AND ts_ms <= $__to), 0) AS current_cost,
                    COALESCE(
                      (SELECT SUM(json_extract(fields_json, '$.cost_usd_micros')) / 7.0 FROM events
                       WHERE name = 'server.turn_usage'
                         AND ts_ms >= $__from
                         AND ts_ms < ($__to - 86400000)), 0) AS baseline
                )
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 3
                  operator:
                    type: and
