# SwiftLint configuration for Oppi
# Practical rules — catch real issues, not style nitpicks

included:
  - Oppi
  - OppiTests
  - Shared

excluded:
  - Oppi.xcodeproj
  - .build

# Disable noisy rules that don't catch real bugs
disabled_rules:
  - trailing_comma # Swift allows trailing commas, consistent style
  - identifier_name # Short names (i, c, n) are fine in loops/closures
  - implicit_optional_initialization
  - file_length
  - line_length
  - function_body_length
  - type_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - nesting
  - blanket_disable_command # Allow file-level suppressions for tests/fixtures
  # Every hit is `override class` of URLProtocol or UIView.layerClass.
  # Those superclass methods are class methods; `static` cannot override them.
  - static_over_final_class
  # Every hit is intentional lossy UTF-8 (`String(decoding:as:)`), which
  # replaces invalid bytes. The failable initializer would return nil instead.
  - optional_data_string_conversion
  # Every hit is CGRect.intersection(_:).isEmpty. CGRect has no isDisjoint(with:).
  - is_disjoint

# Opt-in rules worth enabling
opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fatal_error_message
  - first_where
  - force_unwrapping
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - overridden_super_call
  # - pattern_matching_keywords  # too noisy — revisit later
  - prefer_self_in_static_references
  - prefer_self_type_over_type_of_self
  - private_action
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture

# Analyzer-only rules (run under `swiftlint analyze`)
analyzer_rules:
  - unused_declaration
  - unused_import

# Force casts/tries — warn (sometimes necessary for Codable/UIKit)
force_cast:
  severity: warning

force_try:
  severity: warning

force_unwrapping:
  severity: warning

empty_count:
  severity: warning

enum_case_associated_values_count:
  warning: 7
  error: 10

# Three-element tuples are local layout, color, and range helpers. Naming each
# one would add a type without making the call site clearer.
large_tuple:
  warning: 3
  error: 6

# View and test type names are descriptive on purpose. The longest current
# name is WorkspaceSplitWorkspaceConfigurationDestinationView (51). Shortening
# names that identify a screen would make call sites worse. ID is a nested
# keymap identifier, not a wire or Codable key.
type_name:
  min_length:
    warning: 3
    error: 0
  max_length:
    warning: 55
    error: 70
  excluded:
    - ID
  allowed_symbols:
    - "_"
  validates_start_with_lowercase: error

custom_rules:
  no_force_unwrap_production:
    name: "No force unwrap in production code"
    included: "Oppi|Shared"
    excluded: "OppiTests"
    regex: "(?:\\)|\\]|\\b[A-Za-z_][A-Za-z0-9_\\.]*)!(?![=])"
    message: "Force unwraps are banned in production code. See AGENTS.md (Swift)."
    severity: error

  main_actor_observable:
    name: "@Observable classes should be @MainActor"
    included: "Oppi|Shared"
    excluded: "OppiTests"
    # @MainActor on the line above, or between @Observable and class, already
    # satisfies the rule. NSRegularExpression lookbehind is fixed-width.
    regex: "(?<!@MainActor\\n)^\\s*@Observable\\s*(?:\\n\\s*@(?!MainActor\\b)[^\\n]+\\s*)*\\n\\s*(?:final\\s+)?class\\b"
    message: "Annotate @Observable classes with @MainActor. See AGENTS.md (Swift)."
    severity: warning
