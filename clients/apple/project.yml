# ─── Oppi iOS + macOS ───
# Fork setup: change bundleIdPrefix and DEVELOPMENT_TEAM to your own values.
# See CONTRIBUTING.md for full setup instructions.
name: Oppi
packages:
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark.git
    from: "0.7.1"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.0"
  swift-tree-sitter:
    url: https://github.com/tree-sitter/swift-tree-sitter
    from: "0.25.0"
  tree-sitter-bash:
    url: https://github.com/tree-sitter/tree-sitter-bash
    from: "0.25.0"

options:
  bundleIdPrefix: dev.chenda
  deploymentTarget:
    iOS: "26.0"
    macOS: "15.0"
  xcodeVersion: "26.2"
  generateEmptyDirectories: true
  defaultLocalization: en
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    ENABLE_USER_SCRIPT_SANDBOXING: true
    OPPI_TELEMETRY_MODE: "internal"
    APP_GROUP_IDENTIFIER: group.oppi
    DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
  configs:
    Release:
      OPPI_TELEMETRY_MODE: "public"
targets:
  Oppi:
    type: application
    platform: iOS
    sources:
      - path: Oppi
        type: group
        excludes:
          - "Resources/AppIcon.icon"
      - path: Oppi/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: OppiCore
        type: group
        excludes:
          - "PlatformAdapters"
      - path: Shared
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.Oppi
        PRODUCT_NAME: Oppi
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 40
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AZAQMY4SPZ
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
    entitlements:
      path: Oppi/Resources/Oppi.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: Oppi/Resources/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: Oppi
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.chenda.oppi.invite
            CFBundleURLSchemes:
              - oppi
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
          - audio
        NSSupportsLiveActivities: true
        NSCameraUsageDescription: "Oppi uses the camera to take photos for agent conversations."
        NSPhotoLibraryAddUsageDescription: "Oppi saves images from agent conversations to your photo library."
        NSPhotoLibraryUsageDescription: "Oppi accesses your photo library to attach images to agent conversations."
        NSLocalNetworkUsageDescription: "Oppi needs local network access to connect to your Mac server."
        NSBonjourServices:
          - "_oppi._tcp"
          - "_oppi-pair._tcp"
        NSMicrophoneUsageDescription: "Oppi uses the microphone to transcribe your voice into text prompts."
        NSSpeechRecognitionUsageDescription: "Oppi uses on-device speech recognition to convert your voice into text."
        NSFaceIDUsageDescription: "Oppi uses Face ID to confirm approval of high-risk agent actions like sudo, force push, and recursive deletes."
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts:
          - FiraCode-Regular.ttf
          - FiraCode-SemiBold.ttf
          - FiraCode-Bold.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-SemiBold.ttf
          - JetBrainsMono-Bold.ttf
          - CascadiaCode-Regular.ttf
          - CascadiaCode-SemiBold.ttf
          - CascadiaCode-Bold.ttf
          - SourceCodePro-Regular.otf
          - SourceCodePro-Semibold.otf
          - SourceCodePro-Bold.otf
          - MonaspaceNeon-Regular.otf
          - MonaspaceNeon-SemiBold.otf
          - MonaspaceNeon-Bold.otf
        ITSAppUsesNonExemptEncryption: false
        OPPITelemetryMode: "$(OPPI_TELEMETRY_MODE)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
    preBuildScripts:
      - script: |
          mkdir -p "$DERIVED_FILE_DIR"
          STAMP_FILE="$DERIVED_FILE_DIR/swiftlint.stamp"
          WATCH_DIRS=(
            "$SRCROOT/Oppi"
            "$SRCROOT/OppiCore"
            "$SRCROOT/Shared"
            "$SRCROOT/OppiActivityExtension"
            "$SRCROOT/OppiControlWidget"
            "$SRCROOT/OppiShareExtension"
            "$SRCROOT/OppiTests"
            "$SRCROOT/OppiPerfTests"
            "$SRCROOT/OppiUITests"
            "$SRCROOT/OppiE2ETests"
            "$SRCROOT/OppiMac"
            "$SRCROOT/OppiMacTests"
          )

          needs_lint=0
          if [ ! -f "$STAMP_FILE" ]; then
            needs_lint=1
          elif [ "$SRCROOT/.swiftlint.yml" -nt "$STAMP_FILE" ]; then
            needs_lint=1
          else
            for dir in "${WATCH_DIRS[@]}"; do
              if [ -d "$dir" ] && find "$dir" -type f -name "*.swift" -newer "$STAMP_FILE" -print -quit | grep -q .; then
                needs_lint=1
                break
              fi
            done
          fi

          if [ "$needs_lint" -eq 0 ]; then
            echo "note: SwiftLint skipped (no source/config changes since last run)"
            exit 0
          fi

          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint lint --config "$SRCROOT/.swiftlint.yml" --quiet
            touch "$STAMP_FILE"
          else
            echo "warning: SwiftLint not installed — brew install swiftlint"
            touch "$STAMP_FILE"
          fi
        name: SwiftLint
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        showEnvVars: false
      - script: |
          mkdir -p "$DERIVED_FILE_DIR"
          STAMP_FILE="$DERIVED_FILE_DIR/architecture-boundaries.stamp"
          CHECK_SCRIPT="$SRCROOT/../../server/scripts/check-architecture-boundaries.ts"
          ARCH_RULES="$SRCROOT/../../docs/architecture-client.md"
          WATCH_DIRS=(
            "$SRCROOT/Oppi"
            "$SRCROOT/OppiCore"
            "$SRCROOT/Shared"
            "$SRCROOT/OppiActivityExtension"
            "$SRCROOT/OppiControlWidget"
            "$SRCROOT/OppiShareExtension"
          )

          needs_check=0
          if [ ! -f "$STAMP_FILE" ]; then
            needs_check=1
          elif [ -f "$CHECK_SCRIPT" ] && [ "$CHECK_SCRIPT" -nt "$STAMP_FILE" ]; then
            needs_check=1
          elif [ -f "$ARCH_RULES" ] && [ "$ARCH_RULES" -nt "$STAMP_FILE" ]; then
            needs_check=1
          else
            for dir in "${WATCH_DIRS[@]}"; do
              if [ -d "$dir" ] && find "$dir" -type f -name "*.swift" -newer "$STAMP_FILE" -print -quit | grep -q .; then
                needs_check=1
                break
              fi
            done
          fi

          if [ "$needs_check" -eq 0 ]; then
            echo "note: Architecture boundaries skipped (no source/rule changes since last run)"
            exit 0
          fi

          if command -v node >/dev/null 2>&1; then
            bun "$CHECK_SCRIPT" --scope ios --format xcode
            touch "$STAMP_FILE"
          else
            echo "error: Node.js is required for architecture boundary checks (docs/architecture-client.md#client-boundary-rules-current-code)"
            exit 1
          fi
        name: ArchitectureBoundaries
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        showEnvVars: false
    dependencies:
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
      - package: swift-tree-sitter
        product: SwiftTreeSitter
      - package: tree-sitter-bash
        product: TreeSitterBash
      - target: OppiActivityExtension
        embed: true
      - target: OppiControlWidget
        embed: true
      - target: OppiShareExtension
        embed: true

  OppiActivityExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: OppiActivityExtension
        type: group
      - path: Shared
        type: group
        excludes:
          - "ModelColorHelpers.swift"
      - path: OppiCore/Formatting/SessionFormatting.swift
        type: file
    entitlements:
      path: OppiActivityExtension/OppiActivityExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.Oppi.ActivityExtension
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 40
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AZAQMY4SPZ
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: Oppi
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
        INFOPLIST_KEY_NSSupportsLiveActivities: true

  OppiShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: OppiShareExtension
        type: group
      - path: Shared
        type: group
        excludes:
          - "ModelColorHelpers.swift"
          - "PiSessionAttributes.swift"
          - "LiveActivityPresentation.swift"
          - "ClientLogUploadModels.swift"
          - "ClientLogUploadQueue.swift"
          - "NearbyPairing"
          - "Renderers"
          - "Models"
    entitlements:
      path: OppiShareExtension/OppiShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: OppiShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Oppi
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.Oppi.ShareExtension
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 40
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AZAQMY4SPZ

  OppiControlWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: OppiControlWidget
        type: group
      - path: Shared
        type: group
        excludes:
          - "ModelColorHelpers.swift"
      - path: OppiCore/Formatting/SessionFormatting.swift
        type: file
    entitlements:
      path: OppiControlWidget/OppiControlWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    info:
      path: OppiControlWidget/Info.plist
      properties:
        CFBundleDisplayName: Oppi
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.Oppi.ControlWidget
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 40
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: AZAQMY4SPZ
        CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: "YES"

  OppiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OppiTests
        type: group
    dependencies:
      - target: Oppi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.OppiTests
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"

  OppiPerfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OppiPerfTests
        type: group
    dependencies:
      - target: Oppi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.OppiPerfTests
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"

  OppiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OppiUITests
        type: group
    dependencies:
      - target: Oppi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.OppiUITests
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"

  OppiE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: OppiE2ETests
        type: group
    dependencies:
      - target: Oppi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.OppiE2ETests
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"

  OppiMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: OppiMacTests
        type: group
    dependencies:
      - target: OppiMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.OppiMacTests
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Oppi.app/Contents/MacOS/Oppi"
        BUNDLE_LOADER: "$(TEST_HOST)"

  OppiMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: OppiMac
        type: group
      - path: OppiCore
        type: group
        excludes:
          - "PlatformAdapters"
      - path: Shared
        type: group
        excludes:
          - "PiSessionAttributes.swift"
          - "LiveActivityPresentation.swift"
          - "SharedConstants.swift"
          - "ShareQuickSessionPayload.swift"
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chenda.OppiMac
        PRODUCT_NAME: Oppi
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: 40
        CODE_SIGN_IDENTITY: "Developer ID Application"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: AZAQMY4SPZ
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_ENTITLEMENTS: OppiMac/OppiMac.entitlements
      configs:
        Debug:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_ALLOWED: "NO"
          ENABLE_HARDENED_RUNTIME: false
    info:
      path: OppiMac/Resources/Info.plist
      properties:
        CFBundleDisplayName: Oppi
        SUFeedURL: "https://github.com/duh17/oppi/releases/download/appcast/appcast.xml"
        SUPublicEDKey: "wnLCIfY048anOcj7/J/Iv6Lp9Fmba4zQ0EjCL7k/M+E="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        NSLocalNetworkUsageDescription: "Oppi uses the local network to pair nearby iPhones with this Mac."
        NSBonjourServices:
          - "_oppi-pair._tcp"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

schemes:
  OppiUnitTests:
    build:
      targets:
        Oppi: all
        OppiActivityExtension: all
        OppiControlWidget: all
        OppiShareExtension: all
        OppiTests: [test]
    test:
      targets:
        - name: OppiTests
          randomExecutionOrder: true

  Oppi:
    build:
      targets:
        Oppi: all
        OppiActivityExtension: all
        OppiControlWidget: all
        OppiShareExtension: all
        OppiTests: [test]
        OppiPerfTests: [test]
        OppiUITests: [test]
        OppiE2ETests: [test]
    test:
      targets:
        - name: OppiTests
          randomExecutionOrder: true
        - name: OppiPerfTests
        - name: OppiUITests
        - name: OppiE2ETests

  OppiMac:
    build:
      targets:
        OppiMac: all
        OppiMacTests: [test]
    test:
      targets:
        - name: OppiMacTests
          parallelizable: true
          randomExecutionOrder: true
