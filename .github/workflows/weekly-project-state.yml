name: Weekly project state

on:
  schedule:
    # Friday morning in Pacific Time (08:00 PST / 09:00 PDT).
    - cron: "0 16 * * 5"
  workflow_dispatch:
    inputs:
      lookback_days:
        description: Fallback lookback when no previous report exists
        required: false
        default: "7"
  pull_request:
    paths:
      - .github/scripts/weekly-project-state.cjs
      - .github/scripts/weekly-project-state.test.cjs
      - .github/workflows/weekly-project-state.yml

permissions:
  contents: read

concurrency:
  group: weekly-project-state-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'pull_request'
    name: Validate reporter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run reporter tests
        run: node --test .github/scripts/weekly-project-state.test.cjs

  publish:
    if: github.event_name != 'pull_request'
    name: Publish repository summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: read
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run reporter tests
        run: node --test .github/scripts/weekly-project-state.test.cjs

      - name: Build and publish report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          REPORT_TIME_ZONE: America/Los_Angeles
        with:
          retries: 3
          script: |
            const publish = require('./.github/scripts/weekly-project-state.cjs')
            await publish({ github, context, core })
